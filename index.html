<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전인고등학교 미래공학</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#fcfaf7] text-stone-800 font-sans antialiased">

  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-stone-800 flex items-center justify-center font-bold text-amber-50">FE</div>
        <span class="font-bold text-lg tracking-wide text-stone-900">전인고 미래공학</span>
      </div>
      <div class="hidden md:flex gap-8 text-sm font-semibold text-stone-600">
        <a href="#about" class="hover:text-amber-700 transition">소개</a>
        <a href="#projects" class="hover:text-amber-700 transition">주요 활동</a>
        <a href="#ai-lab" class="hover:text-amber-700 transition">토요 AI LAB</a>
        <a href="#board" class="hover:text-amber-700 transition">커뮤니티</a>
      </div>
    </div>
  </nav>

  <section class="py-16 px-6 text-center max-w-4xl mx-auto">
    <span class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-200">
      Jeonin High School Future Engineering
    </span>
    <h1 class="text-4xl md:text-5xl font-extrabold mt-6 leading-tight text-stone-900">
      상상을 현실로 구현하는<br>
      <span class="text-amber-800">미래공학 메이커 스페이스</span>
    </h1>
    <p class="mt-4 text-stone-600 text-base md:text-lg max-w-2xl mx-auto">
      로보틱스, 데이터 분석, 하드웨어 제어부터 인공지능 모델 구축까지. 주말에도 불이 꺼지지 않는 미래공학반 공간입니다.
    </p>
  </section>

  <section id="board" class="py-10 max-w-4xl mx-auto px-4">
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold text-stone-900">미래공학 피드</h2>
      <p class="text-stone-500 text-sm mt-1">Neon DB & Vercel Blob 기반 활동 공유 공간</p>
    </div>

    <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm mb-8">
      <h3 class="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square text-amber-700"></i> 새 글 작성하기
      </h3>
      <form id="postForm" class="space-y-4">
        <input type="text" id="postTitle" placeholder="제목을 입력하세요" required
          class="w-full px-4 py-2.5 rounded-xl border border-stone-200 bg-stone-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-sm">
        
        <textarea id="postContent" rows="3" placeholder="활동 내용이나 프로젝트 소식을 자유롭게 남겨주세요." required
          class="w-full px-4 py-2.5 rounded-xl border border-stone-200 bg-stone-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-sm resize-none"></textarea>
        
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2">
          <input type="file" id="postImage" accept="image/*"
            class="block w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-900 hover:file:bg-amber-200 cursor-pointer">
          
          <button type="submit" id="submitBtn"
            class="w-full sm:w-auto px-6 py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-semibold rounded-xl text-sm transition shadow-sm whitespace-nowrap">
            게시하기
          </button>
        </div>
      </form>
    </div>

    <div id="postFeed" class="space-y-4">
      <div class="bg-white rounded-2xl border border-stone-200 p-6 text-center text-stone-400">
        게시글을 불러오는 중입니다...
      </div>
    </div>
  </section>

  <script>
    const postForm = document.getElementById('postForm');
    const postFeed = document.getElementById('postFeed');

    // 1. 게시글 목록 불러오기
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        
        if (!posts || posts.length === 0) {
          postFeed.innerHTML = `<div class="bg-white rounded-2xl border border-stone-200 p-8 text-center text-stone-500">아직 등록된 게시글이 없습니다. 첫 번째 글을 남겨보세요!</div>`;
          return;
        }

        postFeed.innerHTML = posts.map(post => `
          <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden flex flex-col md:flex-row">
            <div class="bg-stone-50 md:w-12 p-3 flex md:flex-col items-center justify-center gap-1 border-b md:border-b-0 md:border-r border-stone-200 text-stone-500 font-semibold text-xs">
              <button class="hover:text-amber-700 transition"><i class="fa-solid fa-arrow-up"></i></button>
              <span>${post.likes || 0}</span>
              <button class="hover:text-amber-700 transition"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
            
            <div class="p-5 flex-1">
              <div class="text-xs text-stone-400 mb-1">
                <span>미래공학 부원</span> • <span>${new Date(post.created_at).toLocaleDateString('ko-KR')}</span>
              </div>
              <h4 class="text-lg font-bold text-stone-900 mb-2">${post.title}</h4>
              <p class="text-stone-600 text-sm leading-relaxed mb-4 whitespace-pre-line">${post.content}</p>
              ${post.image_url ? `
                <div class="rounded-xl overflow-hidden bg-stone-100 max-h-96 mb-3 border border-stone-200">
                  <img src="${post.image_url}" class="w-full h-full object-cover" alt="첨부 이미지" loading="lazy">
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        postFeed.innerHTML = `<div class="bg-white rounded-2xl border border-stone-200 p-6 text-center text-stone-400">게시글을 불러오지 못했습니다.</div>`;
      }
    }

    // 2. 게시글 및 이미지 업로드 제출
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '업로드 중...';
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('title', document.getElementById('postTitle').value);
      formData.append('content', document.getElementById('postContent').value);
      
      const imageFile = document.getElementById('postImage').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          postForm.reset();
          loadPosts();
        } else {
          alert('게시글 등록에 실패했습니다.');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류가 발생했습니다.');
      } finally {
        submitBtn.innerText = '게시하기';
        submitBtn.disabled = false;
      }
    });

    loadPosts();
  </script>
</body>
</html>
  </footer>

</body>
</html>
